[project]
name = "wolfpack-amp"
version = "0.1.0"
description = "Wolfpack Control Plane backend (AMP - Agent Management Platform)."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.2",
    "pyjwt>=2.8",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.9",
    "redis>=5.0",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "cryptography>=42.0",
    "wolfpackai",
]

[tool.uv.sources]
wolfpackai = { path = "../../framework", editable = true }

[project.optional-dependencies]
inngest = ["inngest>=0.5"]
test = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.alembic]
script_location = "alembic"

[tool.setuptools.packages.find]
include = ["app*"]

[project.scripts]
amp = "app.main:main"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: wolfpack
      POSTGRES_PASSWORD: wolfpack
      POSTGRES_DB: wolfpack
    ports: ["5439:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "wolfpack"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6382:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    environment:
      REDIS_ADDR: redis://redis:6379/0
    depends_on: [redis]

  prometheus:
    image: prom/prometheus:v2.54.1
    ports: ["9090:9090"]
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [redis-exporter]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  qdrant:
    image: qdrant/qdrant
    ports: ["6333:6333", "6334:6334"]
    volumes: [qdrantdata:/qdrant/storage]

  inngest:
    image: inngest/inngest
    ports: ["8289:8288"]
    environment:
      DATABASE_URL: postgres://wolfpack:wolfpack@postgres:5432/wolfpack
      REDIS_URL: redis://redis:6379/0
    depends_on: [postgres, redis]

  dev:
    build:
      context: ..
      dockerfile: docker/dev.Dockerfile
    ports: ["8000:8000", "5173:5173"]

volumes:
  pgdata:
  miniodata:
  qdrantdata:

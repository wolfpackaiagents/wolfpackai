services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: wolfpack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: wolfpack
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "wolfpack"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    environment:
      REDIS_ADDR: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    ports: ["9090:9090"]
    volumes: ["./prometheus.production.yml:/etc/prometheus/prometheus.yml:ro"]
    depends_on:
      redis-exporter:
        condition: service_started

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  qdrant:
    image: qdrant/qdrant
    ports: ["6333:6333", "6334:6334"]
    volumes: [qdrantdata:/qdrant/storage]

  inngest:
    image: inngest/inngest
    ports: ["8289:8288"]
    environment:
      DATABASE_URL: postgresql://wolfpack:${POSTGRES_PASSWORD}@postgres:5432/wolfpack
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend:
    image: wolfpackaiagents/wolfpack-amp-backend:0.1.0
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://wolfpack:${POSTGRES_PASSWORD}@postgres:5432/wolfpack
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_BACKEND: redis
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      PROVIDER_SECRETS_MASTER_KEY: ${PROVIDER_SECRETS_MASTER_KEY:?Set PROVIDER_SECRETS_MASTER_KEY}
      WOLFPACK_AUTO_SEED: "0"
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      qdrant:
        condition: service_started

  frontend:
    image: wolfpackaiagents/wolfpack-amp-frontend:0.1.0
    ports: ["80:80"]
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
  qdrantdata:

name: Publish Docker images

on:
  push:
    paths:
      - "control-plane/backend/**"
      - "control-plane/frontend/**"
      - "framework/**"
    branches: [main]

jobs:
  backend:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - "control-plane/backend/**"
              - "framework/**"

      - name: Extract version
        id: version
        if: steps.filter.outputs.backend == 'true'
        run: |
          VERSION=$(python3 -c "import tomllib; f=open('control-plane/backend/pyproject.toml','rb'); print(tomllib.load(f)['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        if: steps.filter.outputs.backend == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.filter.outputs.backend == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        if: steps.filter.outputs.backend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: control-plane/backend/Dockerfile
          push: true
          tags: |
            wolfpackaiagents/wolfpack-amp-backend:latest
            wolfpackaiagents/wolfpack-amp-backend:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - "control-plane/frontend/**"

      - name: Set up Docker Buildx
        if: steps.filter.outputs.frontend == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.filter.outputs.frontend == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push frontend
        if: steps.filter.outputs.frontend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: control-plane/frontend/Dockerfile
          push: true
          tags: |
            wolfpackaiagents/wolfpack-amp-frontend:latest
            wolfpackaiagents/wolfpack-amp-frontend:0.1.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
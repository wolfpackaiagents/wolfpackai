name: Publish to PyPI

# Publishes framework/ to PyPI and records the new version on main through a pull request.
#
# main is protected (pull request, four required checks, linear history), so this workflow never
# pushes to it. It pushes a branch named release/X.Y.Z whose only commit is "Release X.Y.Z" and
# that bumps the package version. Once that pull request is merged, the "Tag release" workflow
# creates the X.Y.Z-RELEASE tag on the merged commit.
#
# The organization does not let GitHub Actions open pull requests with the workflow token, and a
# pull request opened that way would not trigger CI anyway. So:
#   - if the secret RELEASE_PR_TOKEN (a personal access token or app token that can open pull
#     requests on this repository) is set, the workflow opens the pull request with it, before the
#     upload, so a bad token stops the release before the irreversible step;
#   - otherwise it only pushes the branch and prints the command that opens the pull request.
# Either way, a pull request opened by a person or by that token triggers CI like any other.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag in MAJOR.MINOR.PATCH-RELEASE format, for example 1.0.0-RELEASE"
        required: true
        type: string
      dry_run:
        description: "Test everything except the upload to PyPI (the version branch is still pushed and must be deleted)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: framework

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Require the main branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Releases must be dispatched from main."
            exit 1
          fi

      - name: Validate release tag and PyPI version
        id: release
        working-directory: .
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: uv run --with packaging python .github/scripts/validate_pypi_release.py "$RELEASE_TAG"

      - name: Require an unused Git tag
        working-directory: .
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.release.outputs.release_tag }}"; then
            echo "Tag ${{ steps.release.outputs.release_tag }} already exists."
            exit 1
          fi

      - name: Set package version
        run: uv version "${{ steps.release.outputs.version }}" --frozen

      # Only the version line changes. Re-running "uv lock" would reformat the whole file whenever the
      # uv on the runner is newer than the one that wrote it. The AMP backend depends on the local
      # framework, so its lockfile records the framework version too; a stale one fails the next
      # "uv sync --locked" in the AMP backend tests.
      - name: Record the new version in the lockfiles
        working-directory: .
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          python3 .github/scripts/set_lock_version.py framework/uv.lock wolfpackai "${VERSION}"
          python3 .github/scripts/set_lock_version.py control-plane/backend/uv.lock wolfpackai "${VERSION}"

      # --locked also proves that the edited lockfile still matches pyproject.toml.
      - name: Install dependencies
        run: uv sync --extra test --group dev --locked

      - name: Run tests
        run: uv run pytest

      - name: Build package
        run: uv build

      - name: Push the version branch and open its pull request when a token is set
        id: pr
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            branch="release/dry-run-${VERSION}"
            subject="Release ${VERSION} (dry run)"
            title="[dry run] Release ${VERSION}"
          else
            branch="release/${VERSION}"
            subject="Release ${VERSION}"
            title="Release ${VERSION}"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git add framework/pyproject.toml framework/uv.lock control-plane/backend/uv.lock
          if git diff --cached --quiet; then
            echo "::error::The repository already declares version ${VERSION}; there is nothing to bump."
            exit 1
          fi
          git commit -m "${subject}"
          git push origin "${branch}"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

          body="Sets the package version to ${VERSION} and refreshes framework/uv.lock and control-plane/backend/uv.lock."
          if [ "${DRY_RUN}" = "true" ]; then
            body="${body} This is a dry run: nothing was published to PyPI. Close this pull request and delete the branch."
          else
            body="${body} wolfpackai ${VERSION} is published to PyPI by workflow run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Merge with a rebase once the four required checks pass; the Tag release workflow then creates ${VERSION}-RELEASE on the merged commit."
          fi

          if [ "${RELEASE_PR_TOKEN}" != "" ]; then
            if ! url="$(GH_TOKEN="${RELEASE_PR_TOKEN}" gh pr create --base main --head "${branch}" --title "${title}" --body "${body}" 2>"${RUNNER_TEMP}/pr-error.txt")"; then
              cat "${RUNNER_TEMP}/pr-error.txt"
              git push origin --delete "${branch}" || true
              echo "::error::Could not open the version pull request with RELEASE_PR_TOKEN. Check that the token can open pull requests on this repository. Nothing was published to PyPI."
              exit 1
            fi
            number="${url##*/}"
            echo "number=${number}" >> "$GITHUB_OUTPUT"
            {
              echo "### Version pull request"
              echo
              echo "${url}"
              echo
              echo "When the four required checks are green, merge with:"
              echo
              echo '```bash'
              echo "gh pr merge ${number} --repo ${GITHUB_REPOSITORY} --rebase --admin"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Version branch pushed"
              echo
              echo "The branch \`${branch}\` has the version commit. The organization does not let this workflow open pull requests, and no RELEASE_PR_TOKEN secret is set, so open the pull request yourself"
              if [ "${DRY_RUN}" = "true" ]; then
                echo "(and, since this is a dry run, delete the branch instead: \`git push origin --delete ${branch}\`):"
              else
                echo "after the upload finishes:"
              fi
              echo
              echo '```bash'
              echo "gh pr create --repo ${GITHUB_REPOSITORY} --base main --head ${branch} --title \"${title}\" --body \"${body}\""
              echo "gh pr checks --repo ${GITHUB_REPOSITORY} --watch <pull request number>"
              echo "gh pr merge <pull request number> --repo ${GITHUB_REPOSITORY} --rebase --admin"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish to PyPI
        id: publish
        if: ${{ !inputs.dry_run }}
        run: uv publish --token ${{ secrets.PYPI_TOKEN }}

      # The upload is the only irreversible step. If it fails, the version branch describes a release
      # that did not happen, so its pull request (if one was opened) is closed and the branch removed.
      - name: Withdraw the version branch after a failed upload
        if: ${{ failure() && steps.publish.outcome == 'failure' && steps.pr.outputs.branch != '' }}
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.pr.outputs.number }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          if [ "${NUMBER}" != "" ]; then
            gh pr close "${NUMBER}" --delete-branch --comment "The upload to PyPI failed, so this release did not happen."
          else
            git push origin --delete "${BRANCH}"
          fi

name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag in MAJOR.MINOR.PATCH-RELEASE format, for example 1.0.0-RELEASE"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: framework

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Require the main branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Releases must be dispatched from main."
            exit 1
          fi

      - name: Validate release tag and PyPI version
        id: release
        working-directory: .
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: uv run --with packaging python .github/scripts/validate_pypi_release.py "$RELEASE_TAG"

      - name: Require an unused Git tag
        working-directory: .
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.release.outputs.release_tag }}"; then
            echo "Tag ${{ steps.release.outputs.release_tag }} already exists."
            exit 1
          fi

      - name: Set package version
        run: uv version "${{ steps.release.outputs.version }}" --no-sync

      - name: Install dependencies
        run: uv sync --extra test --group dev

      - name: Run tests
        run: uv run pytest

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        run: uv publish --token ${{ secrets.PYPI_TOKEN }}

      - name: Commit release metadata and tag
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add framework/pyproject.toml framework/uv.lock
          git commit -m "Release ${{ steps.release.outputs.version }}"
          git tag -a "${{ steps.release.outputs.release_tag }}" -m "Release ${{ steps.release.outputs.version }}"
          git push origin HEAD:main --follow-tags

name: Docker Hub

on:
  push:
    tags: ["v*"]
    branches: [main]

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: ${{ vars.DOCKER_USERNAME || github.repository_owner }}/wolfpack-amp-backend
  FRONTEND_IMAGE: ${{ vars.DOCKER_USERNAME || github.repository_owner }}/wolfpack-amp-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=,format=short

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: control-plane/backend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=,format=short

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: control-plane/frontend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Compose staging
        run: |
          cd docker
          sed -i "s|image: wolfpack-amp-backend:.*|image: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}|" docker-compose.staging.yml
          sed -i "s|image: wolfpack-amp-frontend:.*|image: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}|" docker-compose.staging.yml
          cat docker-compose.staging.yml
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wolfpackai"
version = "0.1.3"
description = "Python framework for AI agents with observability, governance, and a production control plane."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Álvaro Brito" }]
keywords = ["agents", "ai", "llm", "observability", "rag", "workflow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.0",
    "openai>=1.40",
    "anthropic>=0.34",
    "google-genai>=0.2",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    "pyyaml>=6.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
qdrant = ["qdrant-client>=1.9"]
pgvector = ["pgvector>=0.2", "psycopg[binary]>=3.1"]
chroma = ["chromadb>=0.4"]
knowledge = ["pypdf>=4.0", "python-docx>=1.1", "beautifulsoup4>=4.12", "markdown>=3.5"]
mcp = ["mcp>=1.0,<2"]
sql = ["sqlalchemy>=2.0", "sqlglot>=26.0"]
postgres = ["psycopg[binary]>=3.1"]
mongodb = ["pymongo>=4.10"]
neo4j = ["neo4j>=5.0"]
analytics = ["trino>=0.330", "pyathena>=3.0", "google-cloud-bigquery>=3.0", "clickhouse-connect>=0.8", "snowflake-connector-python>=3.0", "databricks-sql-connector>=3.0"]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.uv]
package = true

[tool.pytest.ini_options]
markers = [
    "integration: requires a running external service",
]

[project.urls]
Homepage = "https://github.com/wolfpackaiagents/wolfpackai"
Repository = "https://github.com/wolfpackaiagents/wolfpackai"
Issues = "https://github.com/wolfpackaiagents/wolfpackai/issues"
Author = "https://www.linkedin.com/in/alvarogomes/"

[tool.setuptools.packages.find]
include = ["wolfpack*"]

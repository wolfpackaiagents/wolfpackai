# Valores padrao do Wolfpack Control Plane (AMP) baseados em docker-compose.production.yml.
# Este arquivo e autossuficiente e instala todo o stack em desenvolvimento com um unico comando:
#   helm upgrade --install wolfpack-control-plane ./deploy/chart/wolfpack-control-plane
#
# Em producao ou homologacao, todos os valores e segredos podem ser substituidos diretamente
# pela linha de comando (--set ou --set-string) sem depender de arquivos adicionais.

# ============================================================================
# Backend API (FastAPI) - docker-compose.production.yml: backend
# ============================================================================
backend:
  replicaCount: 1

  image:
    repository: wolfpackaiagents/wolfpack-amp-backend
    pullPolicy: IfNotPresent
    # Sincronizado com a tag do docker-compose.production.yml
    tag: "0.1.2"

  service:
    type: ClusterIP
    port: 8000

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80

  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 6

  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

# ============================================================================
# Frontend (Nginx SPA + Reverse Proxy) - docker-compose.production.yml: frontend
# ============================================================================
frontend:
  replicaCount: 1

  image:
    repository: wolfpackaiagents/wolfpack-amp-frontend
    pullPolicy: IfNotPresent
    tag: "0.1.0"

  service:
    type: ClusterIP
    port: 80

  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "250m"

  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 15
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# ============================================================================
# Ingress (Roteamento externo unificado)
# ============================================================================
ingress:
  enabled: true
  className: ""
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
  host: amp.local
  tls: false
  tlsSecretName: wildcard-tls

# ============================================================================
# PostgreSQL Transacional (docker-compose.production.yml: postgres)
# ============================================================================
postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent

  auth:
    username: wolfpack
    password: "wolfpack_default_dev_password"
    database: wolfpack

  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# ============================================================================
# ClickHouse Analitico (docker-compose.production.yml: clickhouse)
# ============================================================================
clickhouse:
  enabled: true
  image:
    repository: clickhouse/clickhouse-server
    tag: "24.8"
    pullPolicy: IfNotPresent

  auth:
    username: wolfpack
    database: wolfpack

  service:
    httpPort: 8123
    nativePort: 9000

  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""

  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

# ============================================================================
# PostgreSQL Dedicado para Inngest (docker-compose.production.yml: inngest-postgres)
# ============================================================================
inngestPostgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent

  auth:
    username: wolfpack
    database: inngest

  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""

  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "250m"

# ============================================================================
# Redis (docker-compose.production.yml: redis)
# ============================================================================
redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent

  persistence:
    enabled: true
    size: 2Gi
    storageClass: ""

  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "250m"

# ============================================================================
# MinIO Object Storage (docker-compose.production.yml: minio)
# ============================================================================
minio:
  enabled: true
  image:
    repository: minio/minio
    tag: "latest"
    pullPolicy: IfNotPresent

  auth:
    rootUser: "wolfpackadmin"
    rootPassword: "wolfpackadminpassword"

  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""

  bucket: "wolfpack-events"

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# ============================================================================
# Qdrant Vector Search (docker-compose.production.yml: qdrant)
# ============================================================================
qdrant:
  enabled: true
  image:
    repository: qdrant/qdrant
    tag: "latest"
    pullPolicy: IfNotPresent

  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# ============================================================================
# Inngest Server (docker-compose.production.yml: inngest)
# ============================================================================
inngest:
  enabled: true
  image:
    repository: inngest/inngest
    tag: "latest"
    pullPolicy: IfNotPresent

  # Em producao usa 'inngest start' com conexoes ao postgres e redis dedicados
  devMode: false
  logLevel: info

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# ============================================================================
# Prometheus e Redis Exporter (docker-compose.production.yml: prometheus)
# ============================================================================
prometheus:
  enabled: false

# ============================================================================
# Conexoes Externas (substitutos para quando os servicos embutidos estao false)
# ============================================================================
externalDatabase:
  host: ""
  url: ""

externalClickhouse:
  host: ""
  port: "8123"
  database: "wolfpack"
  username: "wolfpack"

externalInngestDatabase:
  host: ""

externalRedis:
  host: ""
  url: ""

externalMinio:
  endpoint: ""

externalQdrant:
  url: ""

externalInngest:
  url: ""

# ============================================================================
# Segredos da Aplicacao (sobrescreva via --set-string secretData.KEY=val)
# ============================================================================
secretData:
  ADMIN_API_KEY: "sk-dev-admin-key-change-me"
  JWT_SECRET: "dev-jwt-secret-change-me-in-production-0123456789"
  PROVIDER_SECRETS_MASTER_KEY: "paQRzTGtZ07lTZBA_mGEuyRJyJOezGppF1m5illlnQY="
  POSTGRES_PASSWORD: "wolfpack_default_dev_password"
  CLICKHOUSE_PASSWORD: "wolfpack_clickhouse_password"
  INNGEST_SIGNING_KEY: ""
  INNGEST_EVENT_KEY: ""
  MINIO_ROOT_PASSWORD: "wolfpackadminpassword"

# ============================================================================
# Variaveis de Configuracao (ConfigMap)
# ============================================================================
configmapData:
  ENVIRONMENT: "production"
  # Alternar para 'clickhouse' para telemetria espelhada no ClickHouse
  TELEMETRY_STORAGE_BACKEND: "postgres"
  RATE_LIMIT_BACKEND: "redis"
  WOLFPACK_AUTO_SEED: "0"
  MESH_HEARTBEAT_TTL_SECONDS: "90"
  INGESTION_JOB_MAX_ATTEMPTS: "3"
  INGESTION_JOB_LOCK_SECONDS: "300"
  INGESTION_WORKER_POLL_SECONDS: "1"
  INGESTION_DISPATCHER: "local"
  SCHEDULER_DISPATCHER: "local"
  SCHEDULER_POLL_SECONDS: "1"
  SCHEDULER_LEASE_SECONDS: "300"
  SCHEDULER_DEADLINE_SECONDS: "3600"

# ============================================================================
# Globais e ServiceAccount
# ============================================================================
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}

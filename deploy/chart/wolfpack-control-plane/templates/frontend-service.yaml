{{- $fullName := include "wolfpack-control-plane.fullname" . -}}
{{- $frontendName := include "wolfpack-control-plane.frontendName" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $frontendName }}
  labels:
    {{- include "wolfpack-control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "wolfpack-control-plane.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend

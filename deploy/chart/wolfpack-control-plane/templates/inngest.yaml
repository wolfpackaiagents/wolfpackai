{{- if .Values.inngest.enabled -}}
{{- $fullName := include "wolfpack-control-plane.fullname" . -}}
{{- $backendName := include "wolfpack-control-plane.backendName" . -}}
{{- $pgPassword := .Values.postgres.auth.password -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}-inngest
  labels:
    {{- include "wolfpack-control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: inngest
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "wolfpack-control-plane.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: inngest
  template:
    metadata:
      labels:
        {{- include "wolfpack-control-plane.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: inngest
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- if .Values.inngestPostgres.enabled }}
        - name: wait-for-inngest-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z {{ include "wolfpack-control-plane.inngestPostgresHost" . }} 5432; do echo "Waiting for Inngest PostgreSQL..."; sleep 2; done; echo "Inngest PostgreSQL is ready!"']
        {{- end }}
        {{- if .Values.redis.enabled }}
        - name: wait-for-redis
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z {{ $fullName }}-redis 6379; do echo "Waiting for Redis..."; sleep 2; done; echo "Redis is ready!"']
        {{- end }}
      containers:
        - name: inngest
          image: "{{ .Values.inngest.image.repository }}:{{ .Values.inngest.image.tag }}"
          imagePullPolicy: {{ .Values.inngest.image.pullPolicy }}
          {{- if .Values.inngest.devMode }}
          command:
            - "inngest"
            - "dev"
            - "-u"
            - "http://{{ $backendName }}:{{ .Values.backend.service.port }}/api/inngest"
            - "--no-discovery"
          {{- else }}
          command:
            - "inngest"
            - "start"
            {{- if .Values.secretData.INNGEST_SIGNING_KEY }}
            - "--signing-key"
            - {{ .Values.secretData.INNGEST_SIGNING_KEY | quote }}
            {{- end }}
            {{- if .Values.secretData.INNGEST_EVENT_KEY }}
            - "--event-key"
            - {{ .Values.secretData.INNGEST_EVENT_KEY | quote }}
            {{- end }}
            - "--postgres-uri"
            - "postgresql://{{ .Values.inngestPostgres.auth.username }}:$(POSTGRES_PASSWORD)@{{ include "wolfpack-control-plane.inngestPostgresHost" . }}:5432/{{ .Values.inngestPostgres.auth.database }}"
            - "--redis-uri"
            - "redis://{{ $fullName }}-redis:6379/0"
          {{- end }}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $fullName }}-secret
                  key: POSTGRES_PASSWORD
          ports:
            - name: http
              containerPort: 8288
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.inngest.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-inngest
  labels:
    {{- include "wolfpack-control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: inngest
spec:
  type: ClusterIP
  ports:
    - port: 8288
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "wolfpack-control-plane.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: inngest
{{- end }}

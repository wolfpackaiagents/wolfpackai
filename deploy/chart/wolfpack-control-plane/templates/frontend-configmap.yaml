{{- $fullName := include "wolfpack-control-plane.fullname" . -}}
{{- $frontendName := include "wolfpack-control-plane.frontendName" . -}}
{{- $backendName := include "wolfpack-control-plane.backendName" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $frontendName }}-nginx
  labels:
    {{- include "wolfpack-control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_pass http://{{ $backendName }}:{{ .Values.backend.service.port }};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

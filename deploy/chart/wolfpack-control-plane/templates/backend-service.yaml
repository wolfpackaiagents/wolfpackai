{{- $fullName := include "wolfpack-control-plane.fullname" . -}}
{{- $backendName := include "wolfpack-control-plane.backendName" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $backendName }}
  labels:
    {{- include "wolfpack-control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "wolfpack-control-plane.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
---
{{- /* Alias para compatibilidade caso outro servico chame por 'backend' diretamente */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-api
  labels:
    {{- include "wolfpack-control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "wolfpack-control-plane.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend

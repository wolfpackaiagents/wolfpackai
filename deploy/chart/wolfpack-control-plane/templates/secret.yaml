{{- $fullName := include "wolfpack-control-plane.fullname" . -}}
{{- $pgPassword := .Values.postgres.auth.password -}}
{{- $minioUser := .Values.minio.auth.rootUser -}}
{{- $minioPassword := .Values.minio.auth.rootPassword -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-secret
  labels:
    {{- include "wolfpack-control-plane.labels" . | nindent 4 }}
type: Opaque
data:
  ADMIN_API_KEY: {{ .Values.secretData.ADMIN_API_KEY | b64enc | quote }}
  JWT_SECRET: {{ .Values.secretData.JWT_SECRET | b64enc | quote }}
  PROVIDER_SECRETS_MASTER_KEY: {{ .Values.secretData.PROVIDER_SECRETS_MASTER_KEY | b64enc | quote }}
  {{- if .Values.secretData.INNGEST_SIGNING_KEY }}
  INNGEST_SIGNING_KEY: {{ .Values.secretData.INNGEST_SIGNING_KEY | b64enc | quote }}
  {{- end }}
  {{- if .Values.secretData.INNGEST_EVENT_KEY }}
  INNGEST_EVENT_KEY: {{ .Values.secretData.INNGEST_EVENT_KEY | b64enc | quote }}
  {{- end }}

  {{- /* ClickHouse */}}
  CLICKHOUSE_PASSWORD: {{ .Values.secretData.CLICKHOUSE_PASSWORD | default "wolfpack_clickhouse_password" | b64enc | quote }}

  {{- /* PostgreSQL */}}
  POSTGRES_PASSWORD: {{ $pgPassword | b64enc | quote }}
  {{- if .Values.postgres.enabled }}
  DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@%s-postgres:5432/%s" .Values.postgres.auth.username $pgPassword $fullName .Values.postgres.auth.database | b64enc | quote }}
  {{- else }}
  DATABASE_URL: {{ .Values.externalDatabase.url | b64enc | quote }}
  {{- end }}

  {{- /* MinIO */}}
  MINIO_ROOT_USER: {{ $minioUser | b64enc | quote }}
  MINIO_ROOT_PASSWORD: {{ $minioPassword | b64enc | quote }}
  MINIO_ACCESS_KEY: {{ $minioUser | b64enc | quote }}
  MINIO_SECRET_KEY: {{ $minioPassword | b64enc | quote }}
